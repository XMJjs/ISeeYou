name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build deployable plugin JAR
        run: ./gradlew --no-daemon clean build

      - name: Verify bundled CommandAPI
        shell: bash
        run: |
          plugin_jar=$(find build/libs -maxdepth 1 -name 'ISeeYou-*.jar' -print -quit)
          test -n "$plugin_jar"
          jar tf "$plugin_jar" | grep -q '^cn/xor7/xiaohei/icu/libs/commandapi/CommandAPI.class$'
          jar tf "$plugin_jar" | grep -q '^cn/xor7/xiaohei/icu/libs/commandapi/nms/NMS_26_1.class$'
          jar tf "$plugin_jar" | grep -q '^cn/xor7/xiaohei/icu/libs/commandapi/nms/PaperNMS_26_1.class$'
          unzip -p "$plugin_jar" META-INF/maven/dev.jorel/commandapi-paper-shade/pom.properties |
            grep -q '^version=11\.2\.0$'
          if unzip -p "$plugin_jar" paper-plugin.yml leaves-plugin.json 2>/dev/null | grep -q 'CommandAPI'; then
            echo 'External CommandAPI dependency is still present in plugin metadata.' >&2
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISeeYou-${{ github.ref_name }}
          path: build/libs/ISeeYou-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/ISeeYou-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
