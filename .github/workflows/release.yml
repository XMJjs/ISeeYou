name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if manually triggered
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build deployable plugin JAR
        run: ./gradlew --no-daemon clean build

      - name: Verify bundled CommandAPI
        id: verify
        shell: bash
        run: |
          shopt -s nullglob
          plugin_jars=(build/libs/ISeeYou-*.jar)
          if (( ${#plugin_jars[@]} == 0 )); then
            echo 'No deployable ISeeYou JAR was produced in build/libs.' >&2
            ls -la build/libs >&2 || true
            exit 1
          fi

          plugin_jar=''
          entries_file="$RUNNER_TEMP/iseeyou-jar-entries.txt"
          for candidate in "${plugin_jars[@]}"; do
            unzip -Z1 "$candidate" > "$entries_file"
            if grep -Fxq 'cn/xor7/xiaohei/icu/libs/commandapi/CommandAPI.class' "$entries_file"; then
              plugin_jar="$candidate"
              break
            fi
          done
          if [[ -z "$plugin_jar" ]]; then
            echo 'No ISeeYou JAR contains the relocated CommandAPI classes.' >&2
            printf 'Candidate: %s\n' "${plugin_jars[@]}" >&2
            exit 1
          fi

          require_entry() {
            if ! grep -Fxq "$1" "$entries_file"; then
              echo "Missing required JAR entry: $1" >&2
              exit 1
            fi
          }
          require_entry 'cn/xor7/xiaohei/icu/libs/commandapi/nms/NMS_26_1.class'
          require_entry 'cn/xor7/xiaohei/icu/libs/commandapi/nms/PaperNMS_26_1.class'

          properties_file="$RUNNER_TEMP/commandapi-paper-shade.properties"
          unzip -p "$plugin_jar" META-INF/maven/dev.jorel/commandapi-paper-shade/pom.properties > "$properties_file"
          bundled_version=''
          while IFS='=' read -r key value; do
            key="${key%$'\r'}"
            value="${value%$'\r'}"
            if [[ "$key" == 'version' ]]; then
              bundled_version="$value"
              break
            fi
          done < "$properties_file"
          if [[ "$bundled_version" != '11.2.0' ]]; then
            echo "Bundled CommandAPI version is '${bundled_version:-missing}', expected '11.2.0'." >&2
            exit 1
          fi

          metadata_file="$RUNNER_TEMP/iseeyou-plugin-metadata.txt"
          : > "$metadata_file"
          for metadata in paper-plugin.yml leaves-plugin.json; do
            if grep -Fxq "$metadata" "$entries_file"; then
              unzip -p "$plugin_jar" "$metadata" >> "$metadata_file"
            fi
          done
          if grep -q 'CommandAPI' "$metadata_file"; then
            echo 'External CommandAPI dependency is still present in plugin metadata.' >&2
            exit 1
          fi

          echo "Verified deployable JAR: $plugin_jar"
          echo "artifact_path=$PWD/$plugin_jar" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.verify.outputs.artifact_path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}