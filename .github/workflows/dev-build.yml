name: "Dev Build"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build deployable plugin JAR
        run: ./gradlew --no-daemon clean build

      - name: Verify bundled CommandAPI
        shell: bash
        run: |
          plugin_jar=$(find build/libs -maxdepth 1 -name 'ISeeYou-*.jar' -print -quit)
          test -n "$plugin_jar"
          jar tf "$plugin_jar" | grep -q '^cn/xor7/xiaohei/icu/libs/commandapi/CommandAPI.class$'
          if unzip -p "$plugin_jar" paper-plugin.yml leaves-plugin.json 2>/dev/null | grep -q 'CommandAPI'; then
            echo 'External CommandAPI dependency is still present in plugin metadata.' >&2
            exit 1
          fi

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ISeeYou-${{ github.sha }}
          path: build/libs/ISeeYou-*.jar
          if-no-files-found: error
          retention-days: 14
